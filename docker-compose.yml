version: "3.9"

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.40
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    restart: unless-stopped
    networks:
      - web

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
        VITE_MEDIA_URL: ${VITE_MEDIA_URL}
    container_name: hitscord-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend-legacy.rule=Host(`${DOMAIN}`) && PathPrefix(`/hitscord-frontend`)"
      - "traefik.http.routers.frontend-legacy.entrypoints=websecure"
      - "traefik.http.routers.frontend-legacy.tls=true"
      - "traefik.http.routers.frontend-legacy.tls.certresolver=le"
      - "traefik.http.routers.frontend-legacy.middlewares=frontend-legacy-stripprefix"
      - "traefik.http.middlewares.frontend-legacy-stripprefix.stripprefix.prefixes=/hitscord-frontend"
    networks:
      - web
    restart: unless-stopped

  bot-panel:
    build:
      context: ./bot-panel
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
        VITE_APP_BASE: /
    container_name: hitscord-bot-panel
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bot-panel.rule=Host(`${BOT_PANEL_DOMAIN}`)"
      - "traefik.http.routers.bot-panel.entrypoints=websecure"
      - "traefik.http.routers.bot-panel.tls=true"
      - "traefik.http.routers.bot-panel.tls.certresolver=le"
      - "traefik.http.services.bot-panel.loadbalancer.server.port=80"
    networks:
      - web
    restart: unless-stopped

  media-server:
    build:
      context: ./media-server
    container_name: hitscord-media
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media.rule=Host(`${DOMAIN}`) && PathPrefix(`/mediasoup`)"
      - "traefik.http.routers.media.entrypoints=websecure"
      - "traefik.http.routers.media.tls=true"
      - "traefik.http.routers.media.tls.certresolver=le"
      - "traefik.http.services.media.loadbalancer.server.port=3000"
      - "traefik.http.routers.media.middlewares=media-stripprefix"
      - "traefik.http.middlewares.media-stripprefix.stripprefix.prefixes=/mediasoup"
    ports:
      - "3000:3000"
      - "${RTC_MIN_PORT}-${RTC_MAX_PORT}:${RTC_MIN_PORT}-${RTC_MAX_PORT}/udp"
    networks:
      - web
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hitscord-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - web
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: hitscord-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - web
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: hitscord-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hitscord-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - web
    restart: unless-stopped

volumes:
  traefik-letsencrypt:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  web:
    external: false
